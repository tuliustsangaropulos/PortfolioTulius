name: Audit P3 Lighthouse

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-p3-lighthouse.yml
      - scripts/p3-browser-smoke.mjs
      - scripts/p4-visual-audit.mjs
      - scripts/p5-public-rls.mjs
      - src/index.css
      - index.html
      - src/hooks/usePortfolio.ts
      - src/components/public/**
      - vercel.json
      - scripts/generate-seo.mjs
      - scripts/smoke-production.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Production HTTP and SEO smoke
        run: node scripts/smoke-production.mjs
      - name: Lighthouse mobile and desktop
        shell: bash
        run: |
          set +e
          npx --yes lighthouse@13.5.0 https://tulius.work/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path="$RUNNER_TEMP/lighthouse-mobile.json"
          mobile_status=$?
          npx --yes lighthouse@13.5.0 https://tulius.work/ --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path="$RUNNER_TEMP/lighthouse-desktop.json"
          desktop_status=$?
          set -e
          echo "Lighthouse CLI status: mobile=$mobile_status desktop=$desktop_status"
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          let missing = 0
          for (const device of ["mobile", "desktop"]) {
            const filename = path.join(process.env.RUNNER_TEMP, `lighthouse-${device}.json`)
            if (!fs.existsSync(filename)) {
              console.log(`${device}: NO_REPORT`)
              missing++
              continue
            }
            const report = JSON.parse(fs.readFileSync(filename, "utf8"))
            const categories = Object.fromEntries(
              ["performance", "accessibility", "best-practices", "seo"].map((id) => [
                id,
                report.categories?.[id]?.score == null ? null : Math.round(report.categories[id].score * 100),
              ]),
            )
            const metrics = Object.fromEntries(
              Object.entries({
                FCP: "first-contentful-paint",
                LCP: "largest-contentful-paint",
                TBT: "total-blocking-time",
                CLS: "cumulative-layout-shift",
                SI: "speed-index",
              }).map(([key, id]) => [key, report.audits?.[id]?.numericValue ?? null]),
            )
            const lcpNode = report.audits?.["largest-contentful-paint-element"]?.details?.items?.[0]?.node
            console.log(`P6_LCP_ELEMENT_${device.toUpperCase()} ${JSON.stringify({
              selector: lcpNode?.selector ?? null,
              snippet: lcpNode?.snippet?.slice(0, 150) ?? null,
            })}`)
            console.log(`P3_LIGHTHOUSE_${device.toUpperCase()} ${JSON.stringify({
              fetchTime: report.fetchTime,
              finalDisplayedUrl: report.finalDisplayedUrl,
              lighthouseVersion: report.lighthouseVersion,
              categories,
              metrics,
              runtimeError: report.runtimeError ?? null,
            })}`)
            for (const category of ["performance", "accessibility"]) {
              const failures = (report.categories?.[category]?.auditRefs ?? [])
                .filter((entry) => entry.weight > 0)
                .map((entry) => ({
                  id: entry.id,
                  weight: entry.weight,
                  audit: report.audits?.[entry.id],
                }))
                .filter(({ audit }) => audit && typeof audit.score === "number" && audit.score < 1)
                .sort((a, b) => a.audit.score - b.audit.score || b.weight - a.weight)
                .slice(0, 20)
                .map(({ id, audit }) => ({
                  id,
                  title: audit.title,
                  score: audit.score,
                  displayValue: audit.displayValue ?? null,
                  numericValue: audit.numericValue ?? null,
                }))
              console.log(`P3_AUDITS_${device.toUpperCase()}_${category.toUpperCase()} ${JSON.stringify(failures)}`)
              if (category === "accessibility") {
                for (const failed of failures) {
                  const items = (report.audits?.[failed.id]?.details?.items ?? [])
                    .slice(0, 12)
                    .map((item) => ({
                      selector: item.node?.selector ?? null,
                      snippet: item.node?.snippet?.slice(0, 350) ?? null,
                      failureSummary: item.node?.failureSummary?.slice(0, 450) ?? null,
                      contrastRatio: item.contrastRatio ?? null,
                      expectedContrastRatio: item.expectedContrastRatio ?? null,
                    }))
                  console.log(`P3_A11Y_NODES_${device.toUpperCase()}_${failed.id} ${JSON.stringify(items)}`)
                }
              }
            }
          }
          if (missing) process.exitCode = 1
          NODE
      - name: Preserve Lighthouse JSON reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6fb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p6-lighthouse-json
          path: ${{ runner.temp }}/lighthouse-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Browser routes and responsive viewports
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/p3-browser"
          cd "$RUNNER_TEMP/p3-browser"
          npm install --no-audit --no-fund --no-save puppeteer-core@25.16.0
          cp "$GITHUB_WORKSPACE/scripts/p3-browser-smoke.mjs" audit.mjs
          set +e
          node audit.mjs
      - name: P5 anonymous Supabase RLS integration
        shell: bash
        run: |
          cd "$RUNNER_TEMP/p3-browser"
          cp "$GITHUB_WORKSPACE/scripts/p5-public-rls.mjs" p5-public.mjs
          node p5-public.mjs
          browser_status=$?
          cp "$GITHUB_WORKSPACE/scripts/p4-visual-audit.mjs" visual.mjs
          node visual.mjs
          visual_status=$?
          set -e
          test "$browser_status" -eq 0 && test "$visual_status" -eq 0
      - name: Upload editorial screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p4-editorial-42-panels
          path: ${{ runner.temp }}/p4-editorial/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p3-viewport-screenshots
          path: ${{ runner.temp }}/p3-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

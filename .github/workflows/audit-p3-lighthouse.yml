name: Audit P3 Lighthouse

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-p3-lighthouse.yml
      - scripts/p3-browser-smoke.mjs
      - scripts/p3-lcp-triage.mjs
      - scripts/p3-lcp-repeats.mjs
      - scripts/p4-visual-audit.mjs
      - scripts/p5-public-rls.mjs
      - scripts/p6-lighthouse-guard.mjs
      - src/index.css
      - index.html
      - src/hooks/usePortfolio.ts
      - vite.config.ts
      - src/app/**
      - src/components/public/**
      - vercel.json
      - scripts/generate-seo.mjs
      - scripts/smoke-production.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Verify the deployed commit served by the production domain
        shell: bash
        run: |
          set -euo pipefail
          # A deployment may be READY without posting the GitHub 'Vercel'
          # status. Verify the SHA actually served by the production alias.
          for attempt in $(seq 1 45); do
            marker="$(curl --fail --silent --show-error --location --max-time 15 \
              -H "Accept: application/json" -H "Cache-Control: no-cache" \
              "https://tulius.work/p3-deployment.json?sha=$GITHUB_SHA&attempt=$attempt" || true)"
            result="$(printf '%s' "$marker" | node -e '
              let data = ""
              process.stdin.on("data", (part) => data += part)
              process.stdin.on("end", () => {
                try {
                  const parsed = JSON.parse(data)
                  process.stdout.write(
                    /^[0-9a-f]{40}$/.test(parsed.sha) &&
                      parsed.sha === process.env.GITHUB_SHA ? "MATCH" : "PENDING"
                  )
                } catch {
                  process.stdout.write("PENDING")
                }
              })
            ')"
            echo "P3_DEPLOYMENT_CHECK attempt=$attempt sha=$GITHUB_SHA production_marker=$result"
            if [ "$result" = "MATCH" ]; then
              echo "P3_DEPLOYMENT_GATE sha=$GITHUB_SHA production=verified"
              exit 0
            fi
            sleep 4
          done
          echo "Production did not serve the audit SHA: refusing Lighthouse attribution" >&2
          exit 1
      - name: Production HTTP and SEO smoke
        run: node scripts/smoke-production.mjs
      - name: Lighthouse mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          capture() {
            local name="$1"
            local preset="$2"
            local output="$RUNNER_TEMP/lighthouse-$name.json"
            for retry in 1 2 3; do
              rm -f "$output"
              if npx --yes lighthouse@13.5.0 https://tulius.work/ $preset --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path="$output"; then
                if node -e 'const fs=require("fs");const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!report.categories)process.exit(1)' "$output"; then
                  echo "P3_CHROME_CAPTURE name=$name attempt=$retry result=PASS"
                  return 0
                fi
              fi
              echo "P3_CHROME_CAPTURE name=$name attempt=$retry result=RETRY"
              sleep 4
            done
            echo "Unable to capture Lighthouse report for $name" >&2
            return 1
          }
          capture mobile ""
          capture desktop "--preset=desktop"
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          let missing = 0
          for (const device of ["mobile", "desktop"]) {
            const filename = path.join(process.env.RUNNER_TEMP, `lighthouse-${device}.json`)
            if (!fs.existsSync(filename)) {
              console.log(`${device}: NO_REPORT`)
              missing++
              continue
            }
            const report = JSON.parse(fs.readFileSync(filename, "utf8"))
            const categories = Object.fromEntries(
              ["performance", "accessibility", "best-practices", "seo"].map((id) => [
                id,
                report.categories?.[id]?.score == null ? null : Math.round(report.categories[id].score * 100),
              ]),
            )
            const metrics = Object.fromEntries(
              Object.entries({
                FCP: "first-contentful-paint",
                LCP: "largest-contentful-paint",
                TBT: "total-blocking-time",
                CLS: "cumulative-layout-shift",
                SI: "speed-index",
              }).map(([key, id]) => [key, report.audits?.[id]?.numericValue ?? null]),
            )
            const lcpNode = report.audits?.["largest-contentful-paint-element"]?.details?.items?.[0]?.node
            console.log(`P6_LCP_ELEMENT_${device.toUpperCase()} ${JSON.stringify({
              selector: lcpNode?.selector ?? null,
              snippet: lcpNode?.snippet?.slice(0, 150) ?? null,
            })}`)
            console.log(`P3_LIGHTHOUSE_${device.toUpperCase()} ${JSON.stringify({
              fetchTime: report.fetchTime,
              finalDisplayedUrl: report.finalDisplayedUrl,
              lighthouseVersion: report.lighthouseVersion,
              categories,
              metrics,
              runtimeError: report.runtimeError ?? null,
            })}`)
            for (const category of ["performance", "accessibility"]) {
              const failures = (report.categories?.[category]?.auditRefs ?? [])
                .filter((entry) => entry.weight > 0)
                .map((entry) => ({
                  id: entry.id,
                  weight: entry.weight,
                  audit: report.audits?.[entry.id],
                }))
                .filter(({ audit }) => audit && typeof audit.score === "number" && audit.score < 1)
                .sort((a, b) => a.audit.score - b.audit.score || b.weight - a.weight)
                .slice(0, 20)
                .map(({ id, audit }) => ({
                  id,
                  title: audit.title,
                  score: audit.score,
                  displayValue: audit.displayValue ?? null,
                  numericValue: audit.numericValue ?? null,
                }))
              console.log(`P3_AUDITS_${device.toUpperCase()}_${category.toUpperCase()} ${JSON.stringify(failures)}`)
              if (category === "accessibility") {
                for (const failed of failures) {
                  const items = (report.audits?.[failed.id]?.details?.items ?? [])
                    .slice(0, 12)
                    .map((item) => ({
                      selector: item.node?.selector ?? null,
                      snippet: item.node?.snippet?.slice(0, 350) ?? null,
                      failureSummary: item.node?.failureSummary?.slice(0, 450) ?? null,
                      contrastRatio: item.contrastRatio ?? null,
                      expectedContrastRatio: item.expectedContrastRatio ?? null,
                    }))
                  console.log(`P3_A11Y_NODES_${device.toUpperCase()}_${failed.id} ${JSON.stringify(items)}`)
                }
              }
            }
          }
          if (missing) process.exitCode = 1
          NODE
      - name: Repeat mobile Lighthouse to measure laboratory variance
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 2 3; do
            for preset in mobile desktop; do
              extra=""
              if [ "$preset" = desktop ]; then extra="--preset=desktop"; fi
              output="$RUNNER_TEMP/lighthouse-$preset-$attempt.json"
              completed=0
              for retry in 1 2 3; do
                rm -f "$output"
                if npx --yes lighthouse@13.5.0 https://tulius.work/ $extra --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path="$output"; then
                  if node -e 'const fs=require("fs");const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!report.categories)process.exit(1)' "$output"; then
                    completed=1
                    break
                  fi
                fi
                sleep 4
              done
              if [ "$completed" -ne 1 ]; then echo "Lighthouse capture failed: $preset-$attempt" >&2; exit 1; fi
            done
          done
          node scripts/p3-lcp-repeats.mjs "$RUNNER_TEMP"
      - name: Mobile applied-throttling cross-check (diagnostic only)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/lighthouse-mobile-devtools.json"
          npx --yes lighthouse@13.5.0 https://tulius.work/ \
            --throttling-method=devtools \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet --output=json --output-path="$output"
          node -e '
            const fs = require("node:fs")
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            if (report.configSettings?.throttlingMethod !== "devtools" || !report.categories) {
              throw Error("Applied-throttling diagnostic did not use DevTools throttling")
            }
            console.log("P3_APPLIED_THROTTLING_CAPTURE " + JSON.stringify({
              method: report.configSettings.throttlingMethod,
              lcpMs: report.audits?.["largest-contentful-paint"]?.numericValue ?? null,
              fcpMs: report.audits?.["first-contentful-paint"]?.numericValue ?? null,
              runtimeError: Boolean(report.runtimeError),
              diagnosticOnly: true,
            }))
          ' "$output"
      - name: Mobile LCP bottleneck triage
        run: node scripts/p3-lcp-triage.mjs "$RUNNER_TEMP"
      - name: Preserve Lighthouse JSON reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p6-lighthouse-json
          path: ${{ runner.temp }}/lighthouse-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Browser routes and responsive viewports
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/p3-browser"
          cd "$RUNNER_TEMP/p3-browser"
          npm install --no-audit --no-fund --no-save puppeteer-core@25.16.0
          cp "$GITHUB_WORKSPACE/scripts/p3-browser-smoke.mjs" audit.mjs
          set +e
          node audit.mjs
      - name: P5 anonymous Supabase RLS integration
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/p3-browser"
          cp "$GITHUB_WORKSPACE/scripts/p5-public-rls.mjs" p5-public.mjs
          node p5-public.mjs
          browser_status=$?
          cp "$GITHUB_WORKSPACE/scripts/p4-visual-audit.mjs" visual.mjs
          node visual.mjs
          visual_status=$?
          set -e
          test "$browser_status" -eq 0 && test "$visual_status" -eq 0
      - name: Upload editorial screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p4-editorial-38-panels
          path: ${{ runner.temp }}/p4-editorial/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-viewport-screenshots
          path: ${{ runner.temp }}/p3-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce conservative P6 Lighthouse regression budgets
        if: always()
        shell: bash
        run: node "$GITHUB_WORKSPACE/scripts/p6-lighthouse-guard.mjs" "$RUNNER_TEMP"

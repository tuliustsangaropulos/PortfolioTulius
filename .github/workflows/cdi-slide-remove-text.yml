name: Correct CDI slide illustrations (remove visible text)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cdi-slide-remove-text.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdi-slide-remove-text
  cancel-in-progress: false
jobs:
  fix-cdi-illustrations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      P5_ADMIN_EMAIL: ${{ secrets.P5_ADMIN_EMAIL }}
      P5_ADMIN_PASSWORD: ${{ secrets.P5_ADMIN_PASSWORD }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - run: npm install --global pnpm@10.34.8
      - run: pnpm install --frozen-lockfile
      - name: Preserve originals, remove visible SVG text, upload private, publish, link CDI
        run: node scripts/experience-media/publish-cdi-no-text.mjs

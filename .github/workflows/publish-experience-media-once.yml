name: Publish 19 experience illustrations (owner-requested)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-experience-media-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experience-media-publication
  cancel-in-progress: false

jobs:
  publish-experience-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      P5_ADMIN_EMAIL: ${{ secrets.P5_ADMIN_EMAIL }}
      P5_ADMIN_PASSWORD: ${{ secrets.P5_ADMIN_PASSWORD }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Install pnpm 10.34.8
        run: npm install --global pnpm@10.34.8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Upload, publish and link reviewed illustrations
        run: node scripts/experience-media/publish-illustrations.mjs

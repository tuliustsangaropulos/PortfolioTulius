name: Export PortfolioTulius Documentation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - .github/workflows/export-docs-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Export complete Markdown sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-tulius-fontes-md
          path: |
            README.md
            docs/*.md
          if-no-files-found: error
          retention-days: 7
